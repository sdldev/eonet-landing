# compose.prod.yml — Production overlay
#
# Build & run:
#   docker compose -f compose.yml -f compose.prod.yml up -d --build
#
# Atau gunakan image dari registry:
#   docker compose -f compose.yml -f compose.prod.yml up -d

services:
  landing:
    image: ${LANDING_IMAGE:-eonet-landing}:${LANDING_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        PUBLIC_API_BASE: ${PUBLIC_API_BASE:-https://api.eonet.id}
        PUBLIC_MIDTRANS_CLIENT_KEY: ${PUBLIC_MIDTRANS_CLIENT_KEY:-}
        PUBLIC_MIDTRANS_IS_PRODUCTION: ${PUBLIC_MIDTRANS_IS_PRODUCTION:-true}
        PUBLIC_WA_NUMBER: ${PUBLIC_WA_NUMBER:-}
        PUBLIC_TURNSTILE_SITE_KEY: ${PUBLIC_TURNSTILE_SITE_KEY:-}
    container_name: eonet-landing
    ports:
      - "${PORT:-4321}:4321"
    environment:
      HOST: "0.0.0.0"
      PORT: "4321"
      PUBLIC_API_BASE: ${PUBLIC_API_BASE:-https://api.eonet.id}
      PUBLIC_MIDTRANS_CLIENT_KEY: ${PUBLIC_MIDTRANS_CLIENT_KEY:-}
      PUBLIC_MIDTRANS_IS_PRODUCTION: ${PUBLIC_MIDTRANS_IS_PRODUCTION:-true}
      PUBLIC_WA_NUMBER: ${PUBLIC_WA_NUMBER:-}
      PUBLIC_TURNSTILE_SITE_KEY: ${PUBLIC_TURNSTILE_SITE_KEY:-}
    restart: unless-stopped
    networks:
      - eonet-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  eonet-net:
    external: true
