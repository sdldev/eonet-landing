services:
  landing:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
      network: host
    image: eonet-landing:dev
    network_mode: host
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 4321
      PUBLIC_API_BASE: ${PUBLIC_API_BASE:-http://localhost:5000}
      PUBLIC_MIDTRANS_CLIENT_KEY: ${PUBLIC_MIDTRANS_CLIENT_KEY:-}
      PUBLIC_MIDTRANS_IS_PRODUCTION: ${PUBLIC_MIDTRANS_IS_PRODUCTION:-false}
      PUBLIC_WA_NUMBER: ${PUBLIC_WA_NUMBER:-}
      PUBLIC_TURNSTILE_SITE_KEY: ${PUBLIC_TURNSTILE_SITE_KEY:-}
    volumes:
      - .:/app
      - landing-node-modules:/app/node_modules

volumes:
  landing-node-modules:
